# Portable snapshot of the lean Codex setup. No credentials or local project state.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"

[agents.explorer]
description = "Find relevant code and trace behavior."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Implement a scoped change and test it."
config_file = "agents/worker.toml"

[agents.researcher]
description = "Verify specific technical questions."
config_file = "agents/researcher.toml"

[agents.reviewer]
description = "Independently review difficult changes when needed."
config_file = "agents/reviewer.toml"
